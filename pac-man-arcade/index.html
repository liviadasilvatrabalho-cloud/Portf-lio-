<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          var patch = {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          };
          var p = window;
          while (p) {
            var d = Object.getOwnPropertyDescriptor(p, 'fetch');
            if (d) {
              try { Object.defineProperty(p, 'fetch', patch); } catch (e) {}
            }
            p = Object.getPrototypeOf(p);
          }
          try { Object.defineProperty(window, 'fetch', patch); } catch (e) {}
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
